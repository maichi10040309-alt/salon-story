name: apply-rival-phase2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rival-phase2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply rival story phase 2
        run: python .github/scripts/apply_rival_phase2.py
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/state.test.mjs
          node tests/visitor-selection.test.mjs
          node tests/customer-encounters.test.mjs
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v03.js tests/v06-systems.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add rival storylines and relationship events [rival-phase2-applied]'
          git push origin HEAD:main
