name: apply-staff-phase3
on:
  push:
    branches:
      - staff-phase3-affinity
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[staff-phase3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staff-phase3-affinity
          fetch-depth: 0
      - name: Apply phase3 changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          game = Path('src/game-v03.js')
          text = game.read_text()

          energy = "function treatmentEnergyCost(staff,policyMultiplier=1,baseCost=15){const stamina=clamp(Number(staff?.stamina??50),0,100),speed=clamp(Number(staff?.speed??50),0,100),reduction=(stamina-50)*.06+(speed-50)*.03;return Math.max(5,Math.round(Math.max(1,Number(baseCost)||15)*Math.max(.25,Number(policyMultiplier)||1)-reduction))}\n"
          affinity = """function staffCustomerAffinity(staff,customer){\n  if(!staff||!customer)return{score:0,label:'標準',reasons:[],favorite:false};\n  const profile={...(staffProfiles[staff.id]||{}),...(staff.profile||{})},personality=String(customer.personality||''),concern=String(customer.concern||''),best=String(profile.best||''),weak=String(profile.weak||''),budget=Number(customer.budget||0),rank=customerRank(customer),favorite=customer.favoriteStaff===staff.name;let score=0;const reasons=[];\n  if(favorite){score+=4;reasons.push('指名スタッフ')}else if(Number(customer.staffScores?.[staff.id]||0)>=2){score+=2;reasons.push('担当実績あり')}\n  if((staff.trait==='接客上手'||String(profile.personality||'').includes('聞き上手'))&&/慎重|不安|口コミ/.test(personality)){score+=2;reasons.push('接客相性')}\n  if((staff.trait==='技術派'||best.includes('痩身'))&&/痩身|体型|脚|ダイエット/.test(concern)){score+=3;reasons.push('悩みと得意技術が一致')}\n  if(best.includes('フェイシャル')&&/毛穴|小顔|肌|フェイシャル/.test(concern)){score+=3;reasons.push('悩みと得意技術が一致')}\n  if((best.includes('カウンセリング')||staff.trait==='営業上手')&&/慎重|迷|不安/.test(personality)){score+=2;reasons.push('提案相性')}\n  if((best.includes('富裕層接客')||staff.trait==='VIP型')&&(rank==='VIP'||budget>=20000)){score+=3;reasons.push('VIP接客向き')}\n  if(weak.includes('高額提案')&&budget>=18000){score-=1;reasons.push('高額提案はやや苦手')}\n  if(weak.includes('営業トーク')&&/慎重|口コミ/.test(personality)){score-=1;reasons.push('提案スタイル注意')}\n  score=clamp(score,-3,6);const label=score>=5?'◎':score>=2?'○':score<0?'△':'標準';return{score,label,reasons,favorite}\n}\nfunction updateStaffCustomerRelation(customer,staff,score){\n  if(!customer||!staff)return null;customer.staffRelations=customer.staffRelations||{};const relation=customer.staffRelations[staff.id]||{visits:0,points:0,bestScore:0,lastScore:0,lastDay:0};relation.visits++;relation.points=clamp(Number(relation.points||0)+(score>=90?2:score>=75?1:score<50?-1:0),-5,20);relation.bestScore=Math.max(Number(relation.bestScore||0),score);relation.lastScore=score;relation.lastDay=state.day;customer.staffRelations[staff.id]=relation;return relation\n}\n"""
          if affinity.strip() not in text:
              if energy not in text:
                  raise SystemExit('energy anchor not found')
              text = text.replace(energy, energy + affinity)

          pattern = r"function assignmentPageV6\(c\)\{.*?\}\nfunction treatmentDecisionPageV6"
          new_assignment = """function assignmentPageV6(c){const required=manualServiceRequired(c),roster=employedStaffRoster();return`${salonScene('waiting',c)}<div class=\"v6-assignment card\"><div><small>WHO WILL SERVE?</small><h2>${c.name}様を誰が担当しますか？</h2><p>${state.customerConditions[c.id]?.icon||'♡'} ${state.customerConditions[c.id]?.line||'今日もよろしくお願いします。'}</p>${required?'<span class=\"important-customer\">✦ このストーリーはオーナー対応</span>':''}</div><div class=\"v6-assign-actions\"><button class=\"primary\" data-action=\"manualService\">自分で接客する<small>信頼・ストーリー・満足度上限UP</small></button>${roster.map(member=>{const fit=staffCustomerAffinity(member,c),prefix=fit.favorite?'★ 指名 · ':fit.score>=5?'◎ おすすめ · ':'';return`<button class=\"soft\" data-assign-staff=\"${member.id}\" ${required?'disabled':''}>${member.name}に任せる<small>${prefix}相性${fit.label} ${fit.score>0?`+${fit.score}`:fit.score||''} · Energy ${member.energy}% · 技術 ${member.tech} · 接客 ${member.service}</small></button>`}).join('')}</div>${!roster.length?'<p class=\"important-customer\">担当できるスタッフがいません</p>':''}<button class=\"soft wide\" data-action=\"pauseTown\">顧客の合間に街へ出る</button></div>`}\nfunction treatmentDecisionPageV6"""
          text2, n = re.subn(pattern, new_assignment, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'assignment replacement failed: {n}')
          text = text2

          old = "const conditionBonus=conditionServiceBonus(condition,s,c),dayModifier=Number(policy.effects.satisfaction||0)+Number(state.session.eventModifiers.satisfaction||0)+Number(state.session.treatmentBonus||0),planModifier=Number(plan.satisfactionModifier||0),autoModifier=auto?-6:2,specialty=staffSpecialtyAdjustment(state.staff,baseService,plan);"
          new = "const conditionBonus=conditionServiceBonus(condition,s,c),dayModifier=Number(policy.effects.satisfaction||0)+Number(state.session.eventModifiers.satisfaction||0)+Number(state.session.treatmentBonus||0),planModifier=Number(plan.satisfactionModifier||0),autoModifier=auto?-6:2,specialty=staffSpecialtyAdjustment(state.staff,baseService,plan),affinity=staffCustomerAffinity(state.staff,c);"
          if old not in text:
              raise SystemExit('treatment modifier anchor not found')
          text = text.replace(old,new,1)

          old = "const score=clamp(Math.min(plan.cap||100,Math.round(s.base+state.staff.service*.22+state.staff.tech*.22+match+equipmentBonus(c)+fashion+machine+trend+skillBonus+affinity+specialty+choice.satisfaction+conditionBonus+dayModifier+planModifier+autoModifier-pricePenalty-energyPenalty)),0,100);"
          new = "const score=clamp(Math.min(plan.cap||100,Math.round(s.base+state.staff.service*.22+state.staff.tech*.22+match+equipmentBonus(c)+fashion+machine+trend+skillBonus+affinity+specialty+staffCustomerAffinity(state.staff,c).score+choice.satisfaction+conditionBonus+dayModifier+planModifier+autoModifier-pricePenalty-energyPenalty)),0,100);"
          # Older code already uses a local numeric affinity variable for service affinity; preserve it and add customer-fit separately.
          if old in text:
              text = text.replace(old,new,1)
          else:
              old2 = "const score=clamp(Math.min(plan.cap||100,Math.round(s.base+state.staff.service*.22+state.staff.tech*.22+match+equipmentBonus(c)+fashion+machine+trend+skillBonus+affinity+specialty+choice.satisfaction+conditionBonus+dayModifier+planModifier+autoModifier-pricePenalty-energyPenalty)),0,100);"
              if old2 not in text:
                  raise SystemExit('score anchor not found')
              text = text.replace(old2,new,1)

          old = "c.staffScores=c.staffScores||{};c.staffScores[state.staff.id]=(c.staffScores[state.staff.id]||0)+(score>=75?1:0);if(c.staffScores[state.staff.id]>=2)c.favoriteStaff=state.staff.name;"
          new = "c.staffScores=c.staffScores||{};c.staffScores[state.staff.id]=(c.staffScores[state.staff.id]||0)+(score>=75?1:0);const staffRelation=updateStaffCustomerRelation(c,state.staff,score);if(c.staffScores[state.staff.id]>=2||staffRelation?.points>=4)c.favoriteStaff=state.staff.name;"
          if old not in text:
              raise SystemExit('staff score anchor not found')
          text = text.replace(old,new,1)

          old = "c.visitHistory=c.visitHistory||[];c.visitHistory.push({day:state.day,service:s.name,score,sales:sale,staff:state.staff.name,nomination});"
          new = "c.visitHistory=c.visitHistory||[];c.visitHistory.push({day:state.day,service:s.name,score,sales:sale,staff:state.staff.name,nomination,staffAffinity:affinity.score,staffAffinityLabel:affinity.label});"
          if old not in text:
              raise SystemExit('visit history anchor not found')
          text = text.replace(old,new,1)

          old = "c.repeatChance=clamp(20+Math.floor(score*.35)+Math.floor(c.trust*.25)+(star-3)*3+Number(condition?.repeat||0)+Number(state.session.eventModifiers.repeat||0),0,90);"
          new = "c.repeatChance=clamp(20+Math.floor(score*.35)+Math.floor(c.trust*.25)+(star-3)*3+Math.max(0,affinity.score)+Number(condition?.repeat||0)+Number(state.session.eventModifiers.repeat||0),0,90);"
          if old not in text:
              raise SystemExit('repeat chance anchor not found')
          text = text.replace(old,new,1)

          old = "window.__SALON_STORY_TEST__={freshState,migrate,normalizeStaffMember,normalizeStaffRoster,monthlyStaffPayroll,monthlyOperatingExpenses,staffSpecialtyAdjustment,treatmentEnergyCost,isNewCustomer"
          new = "window.__SALON_STORY_TEST__={freshState,migrate,normalizeStaffMember,normalizeStaffRoster,monthlyStaffPayroll,monthlyOperatingExpenses,staffSpecialtyAdjustment,treatmentEnergyCost,staffCustomerAffinity,updateStaffCustomerRelation,isNewCustomer"
          if old not in text:
              raise SystemExit('test export anchor not found')
          text = text.replace(old,new,1)
          old = "Object.assign(window.__SALON_STORY_TEST__,{selectTreatmentPlan"
          new = "Object.assign(window.__SALON_STORY_TEST__,{assignmentPageV6,selectTreatmentPlan"
          if old not in text:
              raise SystemExit('assign export anchor not found')
          text = text.replace(old,new,1)

          game.write_text(text)

          test = Path('tests/v06-systems.test.mjs')
          t = test.read_text()
          anchor = "assert.equal(api.assignedStaffForCurrentCustomer().id,staffTemplates[1].id,'現在顧客の担当スタッフを取得できる');\n"
          extra = """\nconst cautiousCustomer={...assignmentState.customers[0],personality:'慎重',concern:'毛穴',budget:12000,favoriteStaff:staffTemplates[0].name,staffScores:{[staffTemplates[0].id]:2}};\nconst favoriteFit=api.staffCustomerAffinity(staffTemplates[0],cautiousCustomer),otherFit=api.staffCustomerAffinity(staffTemplates[1],cautiousCustomer);\nassert.ok(favoriteFit.score>otherFit.score,'指名スタッフは担当相性が高くなる');\nassert.equal(favoriteFit.favorite,true,'お気に入りスタッフを指名として判定');\nassert.match(api.assignmentPageV6(cautiousCustomer),/指名/,'担当選択UIに指名状態を表示');\nassert.match(api.assignmentPageV6(cautiousCustomer),/相性/,'担当選択UIにスタッフ相性を表示');\nconst minami=api.normalizeStaffMember({id:'minami'}),vipFit=api.staffCustomerAffinity(minami,{id:'vip-fit',visits:10,trust:95,budget:30000,personality:'結果重視',concern:'小顔'});\nassert.ok(vipFit.score>=3,'VIP型スタッフはVIP顧客との相性が上がる');\nconst relationCustomer={staffRelations:{}};api.setState({...assignmentState,day:12});const relation=api.updateStaffCustomerRelation(relationCustomer,staffTemplates[0],92);\nassert.equal(relation.points,2,'高満足度でスタッフ顧客関係が成長');\nassert.equal(relation.visits,1,'スタッフ別担当回数を記録');\n"""
          if extra.strip() not in t:
              if anchor not in t:
                  raise SystemExit('test anchor not found')
              t = t.replace(anchor, anchor + extra, 1)
          if "assert.match(source,/staffRelations/,'スタッフ顧客関係を保存');" not in t:
              t = t.replace("assert.match(source,/data-assign-staff/,'顧客ごとのスタッフ担当選択UI');", "assert.match(source,/data-assign-staff/,'顧客ごとのスタッフ担当選択UI');\nassert.match(source,/staffRelations/,'スタッフ顧客関係を保存');")
          test.write_text(t)
          PY
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/v62-systems.test.mjs
          node tests/state.test.mjs
          node tests/customer-encounters.test.mjs
      - name: Commit clean result
        run: |
          rm -f .github/workflows/apply-staff-phase3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add staff customer affinity and nominations [staff-phase3-applied]"
          git push origin HEAD:staff-phase3-affinity
