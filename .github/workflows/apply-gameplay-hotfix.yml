name: apply-gameplay-hotfix
on:
  push:
    paths:
      - '.github/workflows/apply-gameplay-hotfix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply gameplay hotfix
        run: python .github/scripts/apply_gameplay_hotfix.py
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/state.test.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-v03.js tests/v06-systems.test.mjs
          git commit -m "fix: harden business resume and quiet-day flow [gameplay-hotfix-applied]"
          git push origin main
