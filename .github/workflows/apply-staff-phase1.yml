name: apply-staff-phase1
on:
  push:
    branches:
      - apply-staff-phase1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[staff-phase1-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apply-staff-phase1
          fetch-depth: 0
      - name: Apply patch
        run: |
          base64 -d .tmp/staff-phase1.patch.gz.b64 | gzip -d > /tmp/staff-phase1.patch
          git apply --check /tmp/staff-phase1.patch
          git apply /tmp/staff-phase1.patch
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/v62-systems.test.mjs
          node tests/state.test.mjs
          node tests/customer-encounters.test.mjs
      - name: Commit clean result
        run: |
          rm -f .tmp/staff-phase1.patch.gz.b64
          rm -f .github/workflows/apply-staff-phase1.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect staff roster to salon operations [staff-phase1-applied]"
          git push origin HEAD:apply-staff-phase1
