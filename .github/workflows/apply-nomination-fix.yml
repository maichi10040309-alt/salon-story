name: apply-nomination-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[nomination-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply nomination fix
        run: python .github/scripts/apply_nomination_fix.py
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/state.test.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-v03.js tests/v06-systems.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: show nominated staff and cap off-nomination ratings [nomination-fix-applied]"
          git push origin HEAD:main
