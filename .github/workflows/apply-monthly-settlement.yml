name: apply-monthly-settlement
on:
  push:
    branches:
      - monthly-settlement-phase1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[monthly-settlement-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monthly-settlement-phase1
          fetch-depth: 0
      - name: Apply monthly settlement changes
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/game-v03.js')
          s=p.read_text()

          anchor="function monthlyOperatingExpenses(s=state){return Number(s.day)%30===0?monthlyStaffPayroll(s)+(Array.isArray(s.stores)?s.stores.reduce((sum,store)=>sum+Math.max(0,Number(store?.rent)||0),0):0):0}\n"
          addition="""function monthlyGoalRewardMoney(goal){return({sales:50000,reviews:30000,perfect:40000})[goal?.type]||20000}\nfunction finalizeMonthlyReport(s=state){\n  if(Number(s.day)%30!==0)return null;\n  const month=Math.ceil(Number(s.day)/30),existing=(s.monthlyReports||[]).find(x=>x.month===month);if(existing){s.pendingMonthlyReport=existing;return existing}\n  const startDay=(month-1)*30+1,endDay=month*30,entries=(s.history||[]).filter(x=>x.day>=startDay&&x.day<=endDay),salonSales=entries.reduce((sum,x)=>sum+Number(x.sales||0),0),branchSales=entries.reduce((sum,x)=>sum+Number(x.autoSales||0),0),sales=salonSales+branchSales,payroll=monthlyStaffPayroll(s),rent=(Array.isArray(s.stores)?s.stores.reduce((sum,store)=>sum+Math.max(0,Number(store?.rent)||0),0):0),expenses=entries.reduce((sum,x)=>sum+Number(x.expenses||0),0),profit=sales-expenses;\n  const goals=(s.monthlyGoals||[]).map(g=>{const achieved=Number(g.progress||0)>=Number(g.target||0),rewardMoney=achieved?monthlyGoalRewardMoney(g):0;return{id:g.id,type:g.type,title:g.title,target:g.target,progress:g.progress,achieved,reward:g.reward,rewardMoney}}),rewardMoney=goals.reduce((sum,g)=>sum+g.rewardMoney,0),previous=(s.monthlyReports||[]).at(-1)||null;\n  s.money+=rewardMoney;const report={id:`month-${month}`,month,startDay,endDay,salonSales,branchSales,sales,payroll,rent,expenses,profit,goals,rewardMoney,rating:Number(s.rating||0),customers:entries.reduce((sum,x)=>sum+Number(x.guests||0),0),perfect:entries.reduce((sum,x)=>sum+Number(x.perfect||0),0),reviews:entries.reduce((sum,x)=>sum+Number(x.reviews||0),0),newCustomers:entries.reduce((sum,x)=>sum+Number(x.newCustomers||0),0),salesDelta:previous?sales-Number(previous.sales||0):null,profitDelta:previous?profit-Number(previous.profit||0):null,cashAfter:s.money};\n  s.monthlyReports=[...(s.monthlyReports||[]),report].slice(-24);s.pendingMonthlyReport=report;s.news.unshift(`MONTH ${month} 決算：売上 ${yen(sales)}・利益 ${yen(profit)}${rewardMoney?`・目標報酬 ${yen(rewardMoney)}`:''}`);return report\n}\n"""
          if 'function finalizeMonthlyReport' not in s:
              if anchor not in s: raise SystemExit('monthlyOperatingExpenses anchor missing')
              s=s.replace(anchor,anchor+addition,1)

          old="monthlyGoals:createMonthlyGoals(1),monthlyStats:{sales:0,reviews:0,perfect:0,newCustomers:0},declinedCustomers:0"
          new="monthlyGoals:createMonthlyGoals(1),monthlyStats:{sales:0,reviews:0,perfect:0,newCustomers:0},monthlyReports:[],pendingMonthlyReport:null,declinedCustomers:0"
          if old not in s: raise SystemExit('freshState monthly anchor missing')
          s=s.replace(old,new,1)

          old="monthlyGoals:raw.monthlyGoals?.length?raw.monthlyGoals:createMonthlyGoals(Math.floor((raw.day||1)/30)+1),monthlyStats:{...base.monthlyStats,...(raw.monthlyStats||{})},salonDecor:"
          new="monthlyGoals:raw.monthlyGoals?.length?raw.monthlyGoals:createMonthlyGoals(Math.floor((raw.day||1)/30)+1),monthlyStats:{...base.monthlyStats,...(raw.monthlyStats||{})},monthlyReports:Array.isArray(raw.monthlyReports)?raw.monthlyReports:[],pendingMonthlyReport:raw.pendingMonthlyReport||null,salonDecor:"
          if old not in s: raise SystemExit('migrate monthly anchor missing')
          s=s.replace(old,new,1)

          old="state.monthlyStats.sales+=state.todaySales;state.monthlyStats.reviews+=posted.length;state.monthlyStats.perfect+=entry.perfect;state.monthlyStats.newCustomers+=entry.newCustomers;state.monthlyGoals.forEach(g=>g.progress=state.monthlyStats[g.type]||0);state.history.push(entry);state.ads=[];"
          new="state.monthlyStats.sales+=state.todaySales;state.monthlyStats.reviews+=posted.length;state.monthlyStats.perfect+=entry.perfect;state.monthlyStats.newCustomers+=entry.newCustomers;state.monthlyGoals.forEach(g=>g.progress=state.monthlyStats[g.type]||0);state.history.push(entry);const monthlyReport=finalizeMonthlyReport(state);if(monthlyReport)entry.monthlyReportId=monthlyReport.id;state.ads=[];"
          if old not in s: raise SystemExit('closeDay monthly anchor missing')
          s=s.replace(old,new,1)

          old='<button class="primary wide sticky-action" data-action="nextDay">次の日へ進む</button></section>`}'
          new='<button class="primary wide sticky-action" data-action="${r.monthlyReportId?\'monthlyResult\':\'nextDay\'}">${r.monthlyReportId?\'月次決算を見る\':\'次の日へ進む\'}</button></section>`}'
          if old not in s: raise SystemExit('dayResult button anchor missing')
          s=s.replace(old,new,1)

          marker="function levelOverlay(){"
          monthly_page="""function monthlyResultPage(){const r=state.pendingMonthlyReport||(state.monthlyReports||[]).at(-1);if(!r)return homeV62();const salesDelta=r.salesDelta===null?'初月':`${r.salesDelta>=0?'+':''}${yen(r.salesDelta)}`,profitDelta=r.profitDelta===null?'初月':`${r.profitDelta>=0?'+':''}${yen(r.profitDelta)}`;return`<section class=\"v6-day-complete monthly-result\"><small>MONTHLY REPORT</small><h1>Month ${r.month}</h1><p>Day ${r.startDay}〜${r.endDay} の経営結果</p><div class=\"v6-result-reveal\">${[['月間売上',yen(r.sales)],['本店売上',yen(r.salonSales)],['2号店売上',yen(r.branchSales)],['給与',`-${yen(r.payroll)}`],['家賃',`-${yen(r.rent)}`],['月次利益',yen(r.profit)]].map(([label,value],index)=>`<div style=\"--reveal:${index}\"><span>${label}</span><b>${value}</b></div>`).join('')}</div><div class=\"card\"><h3>前月比較</h3><div class=\"row\"><span>売上差</span><b>${salesDelta}</b></div><div class=\"row\"><span>利益差</span><b>${profitDelta}</b></div><div class=\"row\"><span>来店数</span><b>${r.customers}名</b></div><div class=\"row\"><span>口コミ</span><b>${r.reviews}件</b></div><div class=\"row\"><span>PERFECT</span><b>${r.perfect}回</b></div></div><div class=\"card\"><h3>MONTHLY GOALS</h3>${r.goals.map(g=>`<div class=\"row\"><span>${g.achieved?'✅':'▫️'} ${g.title}</span><b>${g.progress} / ${g.target}${g.achieved?` · +${yen(g.rewardMoney)}`:''}</b></div>`).join('')}${r.rewardMoney?`<div class=\"goal-complete\">🎁 月間目標報酬 +${yen(r.rewardMoney)}</div>`:'<p>今月の目標報酬はありません</p>'}</div><div class=\"card\"><div class=\"row\"><span>決算後所持金</span><b>${yen(r.cashAfter)}</b></div>${r.profit<0?'<div class=\"important-customer\">⚠ 今月は赤字です。給与・家賃と売上バランスを見直しましょう。</div>':'<div class=\"goal-complete\">黒字で1か月を終えました</div>'}</div><button class=\"primary wide sticky-action\" data-action=\"nextDay\">翌月へ進む</button></section>`}\n"""
          if 'function monthlyResultPage()' not in s:
              if marker not in s: raise SystemExit('level overlay marker missing')
              s=s.replace(marker,monthly_page+marker,1)

          old="social:socialPageV62,play:playPageV6,serviceResult:serviceResultPageV62,dayResult:dayResultPageV6"
          new="social:socialPageV62,play:playPageV6,serviceResult:serviceResultPageV62,dayResult:dayResultPageV6,monthlyResult:monthlyResultPage"
          if old not in s: raise SystemExit('render pages anchor missing')
          s=s.replace(old,new,1)

          old="document.querySelector('[data-action=\"nextDay\"]')?.addEventListener('click',()=>advanceDay(false));"
          new="document.querySelector('[data-action=\"monthlyResult\"]')?.addEventListener('click',()=>{state.screen='monthlyResult';save();render()});document.querySelector('[data-action=\"nextDay\"]')?.addEventListener('click',()=>{state.pendingMonthlyReport=null;advanceDay(false)});"
          if old not in s: raise SystemExit('nextDay listener anchor missing')
          s=s.replace(old,new,1)

          old="monthlyStaffPayroll,monthlyOperatingExpenses,staffSpecialtyAdjustment"
          new="monthlyStaffPayroll,monthlyOperatingExpenses,monthlyGoalRewardMoney,finalizeMonthlyReport,staffSpecialtyAdjustment"
          if old not in s: raise SystemExit('test export anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('tests/v06-systems.test.mjs')
          x=t.read_text()
          anchor="assert.equal(monthlyClose.staffRoster.find(x=>x.id==='mizuki').energy,90,'閉店後も非担当スタッフのEnergyを保持');\n"
          extra="""const reportState=api.migrate({...api.freshState(),day:30,money:500000,staff:{...staffTemplates[0],energy:80},staffRoster:[{...staffTemplates[0],energy:80}],stores:[{id:'main',name:'本店',rent:70000,dailySales:0,sales:0}],monthlyStats:{sales:320000,reviews:6,perfect:9,newCustomers:3}});\nreportState.monthlyGoals.forEach(g=>g.progress=reportState.monthlyStats[g.type]||0);reportState.history=Array.from({length:30},(_,i)=>({day:i+1,sales:i===29?30000:10000,autoSales:0,expenses:i===29?staffTemplates[0].salary+70000:0,guests:2,reviews:i===29?6:0,perfect:i===29?9:0,newCustomers:i===29?3:0}));api.setState(reportState);const report=api.finalizeMonthlyReport(reportState);\nassert.equal(report.month,1,'Day30で月次決算を確定');\nassert.equal(report.sales,320000,'月間売上を30日分集計');\nassert.equal(report.payroll,staffTemplates[0].salary,'月次決算に給与を表示');\nassert.equal(report.rent,70000,'月次決算に家賃を表示');\nassert.equal(report.goals.every(g=>g.achieved),true,'達成済み月間目標を確定');\nassert.equal(report.rewardMoney,120000,'月間目標報酬を合算');\nassert.equal(reportState.monthlyReports.length,1,'月次結果を履歴保存');\nassert.equal(api.finalizeMonthlyReport(reportState).rewardMoney,120000,'同月再確定でも同じレポートを返す');\nassert.equal(reportState.monthlyReports.length,1,'同じ月を二重保存しない');\n"""
          if extra.strip() not in x:
              if anchor not in x: raise SystemExit('test insertion anchor missing')
              x=x.replace(anchor,anchor+extra,1)
          t.write_text(x)
          PY
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/v62-systems.test.mjs
          node tests/state.test.mjs
          node tests/customer-encounters.test.mjs
          node tests/visitor-selection.test.mjs
          node tests/v61-systems.test.mjs
          node tests/owner-assets.test.mjs
      - name: Commit clean result
        run: |
          rm -f .github/workflows/apply-monthly-settlement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add monthly settlement reports and goal rewards [monthly-settlement-applied]"
          git push origin HEAD:monthly-settlement-phase1
