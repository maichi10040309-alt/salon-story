name: apply-staff-phase2
on:
  push:
    branches:
      - staff-phase2-assignment
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[staff-phase2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staff-phase2-assignment
          fetch-depth: 0
      - name: Apply phase2 changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game-v03.js')
          s=p.read_text()

          anchor="function treatmentEnergyCost(staff,policyMultiplier=1,baseCost=15){const stamina=clamp(Number(staff?.stamina??50),0,100),speed=clamp(Number(staff?.speed??50),0,100),reduction=(stamina-50)*.06+(speed-50)*.03;return Math.max(5,Math.round(Math.max(1,Number(baseCost)||15)*Math.max(.25,Number(policyMultiplier)||1)-reduction))}\n"
          insert=anchor+"function employedStaffRoster(s=state){return(Array.isArray(s.staffRoster)?s.staffRoster:[]).filter(isEmployedStaff)}\nfunction assignedStaffForCurrentCustomer(s=state){const id=s.session?.assignedStaffId;return employedStaffRoster(s).find(member=>member.id===id)||s.staff||null}\nfunction assignStaffForCurrentCustomer(staffId){if(!state.session)return false;const member=employedStaffRoster().find(x=>x.id===staffId);if(!member)return false;state.staff=member;state.session.assignedStaffId=member.id;state.session.assignedStaffName=member.name;state.session.staffAssignments={...(state.session.staffAssignments||{}),[currentCustomer()?.id||`index-${state.session.index}`]:member.id};save();return member}\n"
          assert s.count(anchor)==1
          s=s.replace(anchor,insert)

          old_enter="function enterCurrent(){const c=currentCustomer();if(!c){state.session.phase='idleDay';save();return render()}state.session.choice=null;state.session.treatmentBonus=0;state.session.selectedProposal=null;state.session.selectedPlan=null;state.session.treatmentChoices=null;state.session.autoMode=false;if(isNewCustomer(c)){state.session.phase='newCustomer'}else{state.session.phase='arrival';setTimeout(()=>{if(state.screen==='play'&&state.session?.phase==='arrival'){state.session.phase='assign';save();render()}},700)}save();render()}"
          new_enter="function enterCurrent(){const c=currentCustomer();if(!c){state.session.phase='idleDay';save();return render()}state.session.choice=null;state.session.treatmentBonus=0;state.session.selectedProposal=null;state.session.selectedPlan=null;state.session.treatmentChoices=null;state.session.autoMode=false;state.session.assignedStaffId=null;state.session.assignedStaffName=null;if(isNewCustomer(c)){state.session.phase='newCustomer'}else{state.session.phase='arrival';setTimeout(()=>{if(state.screen==='play'&&state.session?.phase==='arrival'){state.session.phase='assign';save();render()}},700)}save();render()}"
          assert s.count(old_enter)==1
          s=s.replace(old_enter,new_enter)

          old_assign="function assignmentPageV6(c){const required=manualServiceRequired(c),remaining=state.session.queue.length-state.session.index;return`${salonScene('waiting',c)}<div class=\"v6-assignment card\"><div><small>WHO WILL SERVE?</small><h2>${c.name}様を誰が担当しますか？</h2><p>${state.customerConditions[c.id]?.icon||'♡'} ${state.customerConditions[c.id]?.line||'今日もよろしくお願いします。'}</p>${required?'<span class=\"important-customer\">✦ このストーリーはオーナー対応</span>':''}</div><div class=\"v6-assign-actions\"><button class=\"primary\" data-action=\"manualService\">自分で接客する<small>信頼・ストーリー・満足度上限UP</small></button><button class=\"soft\" data-action=\"autoService\" ${required?'disabled':''}>${state.staff.name}に任せる<small>Energy節約・スタッフXP・指名UP</small></button></div>${remaining>1&&!required?`<button class=\"soft wide v6-batch\" data-action=\"autoRemaining\">残り${remaining}名をまとめてスタッフに任せる</button>`:''}<button class=\"soft wide\" data-action=\"pauseTown\">顧客の合間に街へ出る</button></div>`}"
          new_assign="function assignmentPageV6(c){const required=manualServiceRequired(c),roster=employedStaffRoster();return`${salonScene('waiting',c)}<div class=\"v6-assignment card\"><div><small>WHO WILL SERVE?</small><h2>${c.name}様を誰が担当しますか？</h2><p>${state.customerConditions[c.id]?.icon||'♡'} ${state.customerConditions[c.id]?.line||'今日もよろしくお願いします。'}</p>${required?'<span class=\"important-customer\">✦ このストーリーはオーナー対応</span>':''}</div><div class=\"v6-assign-actions\"><button class=\"primary\" data-action=\"manualService\">自分で接客する<small>信頼・ストーリー・満足度上限UP</small></button>${roster.map(member=>`<button class=\"soft\" data-assign-staff=\"${member.id}\" ${required?'disabled':''}>${member.name}に任せる<small>Energy ${member.energy}% · 技術 ${member.tech} · 接客 ${member.service}</small></button>`).join('')}</div>${!roster.length?'<p class=\"important-customer\">担当できるスタッフがいません</p>':''}<button class=\"soft wide\" data-action=\"pauseTown\">顧客の合間に街へ出る</button></div>`}"
          assert s.count(old_assign)==1
          s=s.replace(old_assign,new_assign)

          old_bind="  document.querySelector('[data-action=\"manualService\"]')?.addEventListener('click',()=>{state.session.autoMode=false;state.session.phase='counsel';render()});\n  document.querySelector('[data-action=\"autoService\"]')?.addEventListener('click',()=>autoServeCurrent(false));"
          new_bind="  document.querySelector('[data-action=\"manualService\"]')?.addEventListener('click',()=>{state.session.autoMode=false;state.session.assignedStaffId=null;state.session.assignedStaffName=null;state.session.phase='counsel';render()});\n  document.querySelectorAll('[data-assign-staff]').forEach(b=>b.onclick=()=>{const member=assignStaffForCurrentCustomer(b.dataset.assignStaff);if(!member)return notify('担当スタッフを選べませんでした');autoServeCurrent(false)});"
          assert s.count(old_bind)==1
          s=s.replace(old_bind,new_bind)

          old_api="window.__SALON_STORY_TEST__={freshState,migrate,normalizeStaffMember,normalizeStaffRoster,monthlyStaffPayroll,monthlyOperatingExpenses,staffSpecialtyAdjustment,treatmentEnergyCost,isNewCustomer"
          new_api="window.__SALON_STORY_TEST__={freshState,migrate,normalizeStaffMember,normalizeStaffRoster,monthlyStaffPayroll,monthlyOperatingExpenses,staffSpecialtyAdjustment,treatmentEnergyCost,employedStaffRoster,assignedStaffForCurrentCustomer,assignStaffForCurrentCustomer,isNewCustomer"
          assert s.count(old_api)==1
          s=s.replace(old_api,new_api)
          p.write_text(s)

          t=Path('tests/v06-systems.test.mjs')
          ts=t.read_text()
          anchor_test="assert.equal(started.staffRoster.find(x=>x.id==='mizuki').energy,inactiveEnergyBefore,'非担当スタッフのEnergyは減らない');\n"
          addition=anchor_test+"\nconst assignmentState=api.migrate({...api.freshState(),staff:{...staffTemplates[0],energy:82},staffRoster:[{...staffTemplates[0],energy:82},{...staffTemplates[1],energy:67}]});\nassignmentState.session={queue:[assignmentState.customers[0].id],index:0,results:[],phase:'assign',staffAssignments:{}};api.setState(assignmentState);\nconst assigned=api.assignStaffForCurrentCustomer(staffTemplates[1].id);\nassert.equal(assigned.id,staffTemplates[1].id,'顧客ごとに担当スタッフを選択できる');\nassert.equal(assignmentState.staff,assignmentState.staffRoster[1],'選択したスタッフをactive参照へ接続');\nassert.equal(assignmentState.session.assignedStaffId,staffTemplates[1].id,'現在顧客の担当スタッフIDを保持');\nassert.equal(assignmentState.session.staffAssignments[assignmentState.customers[0].id],staffTemplates[1].id,'顧客別担当履歴を保持');\nassert.equal(api.assignedStaffForCurrentCustomer().id,staffTemplates[1].id,'現在顧客の担当スタッフを取得できる');\n"
          assert ts.count(anchor_test)==1
          ts=ts.replace(anchor_test,addition)
          source_anchor="assert.match(source,/function autoServeRemaining/,'残りをまとめて任せる');"
          assert source_anchor in ts
          ts=ts.replace(source_anchor,source_anchor+"\nassert.match(source,/data-assign-staff/,'顧客ごとのスタッフ担当選択UI');")
          t.write_text(ts)
          PY
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/v62-systems.test.mjs
          node tests/state.test.mjs
          node tests/customer-encounters.test.mjs
      - name: Commit clean result
        run: |
          rm -f .github/workflows/apply-staff-phase2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: assign staff per customer [staff-phase2-applied]"
          git push origin HEAD:staff-phase2-assignment
