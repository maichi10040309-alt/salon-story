name: Extract owner outfits
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract outfit assets
        run: |
          if [ -f owner-outfits-upload.zip ]; then
            unzip -o owner-outfits-upload.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/owner/outfits/OUTFIT_*.png
            if ! git diff --cached --quiet; then
              git commit -m "Add new owner outfit PNG assets"
              git push
            fi
          fi
