name: apply-staff-career-bonuses
on:
  push:
    paths:
      - '.github/workflows/apply-staff-career-bonuses.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply staff career bonuses
        run: python .github/scripts/apply_staff_career_bonuses.py
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/state.test.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-v03.js tests/v06-systems.test.mjs
          git commit -m "feat: add practical staff career bonuses [staff-career-applied]"
          git push origin main
