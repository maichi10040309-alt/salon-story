name: run-endless-apply
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[endless-mode-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply endless mode
        run: python .github/scripts/apply_endless.py
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/v62-systems.test.mjs
          node tests/state.test.mjs
          node tests/customer-encounters.test.mjs
          node tests/visitor-selection.test.mjs
          node tests/owner-assets.test.mjs
      - name: Commit result
        run: |
          rm -f .github/scripts/apply_endless.py
          rm -f .github/workflows/apply-endless-mode-main.yml
          rm -f .github/workflows/run-endless-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add salon master endless mode [endless-mode-applied]"
          git push origin HEAD:main
