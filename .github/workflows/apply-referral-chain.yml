name: apply-referral-chain
on:
  push:
    paths:
      - '.github/workflows/apply-referral-chain.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply referral chain
        run: python .github/scripts/apply_referral_chain.py
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/state.test.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-v03.js tests/v06-systems.test.mjs
          git commit -m "feat: add customer referral chains [referral-chain-applied]"
          git push origin main
