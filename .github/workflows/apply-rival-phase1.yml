name: apply-rival-phase1
on:
  push:
    branches: [rival-system-phase1]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rival-system-phase1
          fetch-depth: 0
      - name: Apply rival phase1
        run: python .github/scripts/apply_rival_phase1.py
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/v62-systems.test.mjs
          node tests/state.test.mjs
          node tests/customer-encounters.test.mjs
          node tests/visitor-selection.test.mjs
          node tests/owner-assets.test.mjs
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v03.js src/v06-systems.js tests/v06-systems.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add rival battle system [rival-phase1-applied]'
          git push origin HEAD:rival-system-phase1
