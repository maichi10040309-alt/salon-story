name: fix-resume-button-binding
on:
  push:
    paths:
      - '.github/workflows/fix-resume-button-binding.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply resume binding fix
        run: python .github/scripts/fix_resume_button_binding.py
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/state.test.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-v03.js tests/v06-systems.test.mjs
          git commit -m "fix: bind every business resume button [resume-binding-applied]"
          git push origin main
