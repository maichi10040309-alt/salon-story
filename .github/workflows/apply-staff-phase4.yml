name: apply-staff-phase4
on:
  push:
    branches:
      - staff-phase4-schedule-fatigue
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[staff-phase4-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staff-phase4-schedule-fatigue
          fetch-depth: 0
      - name: Apply phase4 changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          game = Path('src/game-v03.js')
          text = game.read_text()

          old = "const staffRuntimeDefaults={level:1,xp:0,energy:100,bond:0,role:'新人',management:20,treatments:0,skills:[],nominations:0,monthlySales:0,monthlyPerfect:0,tech:50,service:50,sales:50,speed:50,stamina:50,popularity:0,salary:0};"
          new = "const staffRuntimeDefaults={level:1,xp:0,energy:100,bond:0,role:'新人',management:20,treatments:0,skills:[],nominations:0,monthlySales:0,monthlyPerfect:0,tech:50,service:50,sales:50,speed:50,stamina:50,popularity:0,salary:0,weeklyOff:[],consecutiveWorkDays:0,lastWorkedDay:0,lastRestDay:0};"
          if old not in text: raise SystemExit('runtime defaults anchor not found')
          text = text.replace(old,new,1)

          old = "  member.energy=clamp(value.energy!==null&&value.energy!==''&&Number.isFinite(Number(value.energy))?Number(value.energy):100,0,100);member.skills=Array.isArray(member.skills)?member.skills:[];return member\n}"
          new = "  member.energy=clamp(value.energy!==null&&value.energy!==''&&Number.isFinite(Number(value.energy))?Number(value.energy):100,0,100);member.skills=Array.isArray(member.skills)?member.skills:[];member.weeklyOff=[...new Set((Array.isArray(member.weeklyOff)?member.weeklyOff:[]).map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<7))].slice(0,2);member.consecutiveWorkDays=Math.max(0,Number(member.consecutiveWorkDays)||0);member.lastWorkedDay=Math.max(0,Number(member.lastWorkedDay)||0);member.lastRestDay=Math.max(0,Number(member.lastRestDay)||0);return member\n}"
          if old not in text: raise SystemExit('normalize anchor not found')
          text = text.replace(old,new,1)

          anchor = "function treatmentEnergyCost(staff,policyMultiplier=1,baseCost=15){const stamina=clamp(Number(staff?.stamina??50),0,100),speed=clamp(Number(staff?.speed??50),0,100),reduction=(stamina-50)*.06+(speed-50)*.03;return Math.max(5,Math.round(Math.max(1,Number(baseCost)||15)*Math.max(.25,Number(policyMultiplier)||1)-reduction))}\n"
          helpers = """function staffDayIndex(day=state.day){return((Math.max(1,Number(day)||1)-1)%7+7)%7}\nfunction isStaffOffToday(member,day=state.day){return!!member&&Array.isArray(member.weeklyOff)&&member.weeklyOff.includes(staffDayIndex(day))}\nfunction staffAvailableToday(member,day=state.day){return isEmployedStaff(member)&&!isStaffOffToday(member,day)&&Number(member.energy??100)>=10}\nfunction toggleStaffDayOff(staffId,weekdayIndex){const member=employedStaffRoster().find(x=>x.id===staffId),index=Number(weekdayIndex);if(!member||!Number.isInteger(index)||index<0||index>6)return false;member.weeklyOff=Array.isArray(member.weeklyOff)?[...member.weeklyOff]:[];const at=member.weeklyOff.indexOf(index);if(at>=0)member.weeklyOff.splice(at,1);else{if(member.weeklyOff.length>=2)return false;member.weeklyOff.push(index);member.weeklyOff.sort((a,b)=>a-b)}return true}\nfunction markStaffWorked(member,day=state.day){if(!member)return null;const d=Math.max(1,Number(day)||1);if(member.lastWorkedDay!==d){member.consecutiveWorkDays=member.lastWorkedDay===d-1?Math.max(0,Number(member.consecutiveWorkDays)||0)+1:1;member.lastWorkedDay=d}return member}\nfunction staffFatiguePenalty(member){return clamp(Math.max(0,(Number(member?.consecutiveWorkDays)||0)-4)*2,0,8)}\nfunction recoverStaffForNewDay(s=state,restDay=false){for(const member of employedStaffRoster(s)){const off=restDay||isStaffOffToday(member,s.day),gain=off?45:12;member.energy=clamp(Number(member.energy??100)+gain,0,100);if(off){member.consecutiveWorkDays=0;member.lastRestDay=s.day}}if(s.staff){const active=s.staffRoster?.find(x=>x.id===s.staff.id);if(active)s.staff=active}return s.staffRoster}\n"""
          if helpers.strip() not in text:
              if anchor not in text: raise SystemExit('energy helper anchor not found')
              text = text.replace(anchor, anchor + helpers, 1)

          old = "function assignStaffForCurrentCustomer(staffId){if(!state.session)return false;const member=employedStaffRoster().find(x=>x.id===staffId);if(!member)return false;state.staff=member;state.session.assignedStaffId=member.id;state.session.assignedStaffName=member.name;state.session.staffAssignments={...(state.session.staffAssignments||{}),[currentCustomer()?.id||`index-${state.session.index}`]:member.id};save();return member}"
          new = "function assignStaffForCurrentCustomer(staffId){if(!state.session)return false;const member=employedStaffRoster().find(x=>x.id===staffId);if(!member||!staffAvailableToday(member))return false;state.staff=member;state.session.assignedStaffId=member.id;state.session.assignedStaffName=member.name;state.session.staffAssignments={...(state.session.staffAssignments||{}),[currentCustomer()?.id||`index-${state.session.index}`]:member.id};save();return member}"
          if old not in text: raise SystemExit('assign staff anchor not found')
          text = text.replace(old,new,1)

          pattern = r"function assignmentPageV6\(c\)\{.*?\}\nfunction treatmentDecisionPageV6"
          new_assignment = """function assignmentPageV6(c){const required=manualServiceRequired(c),roster=employedStaffRoster();return`${salonScene('waiting',c)}<div class=\"v6-assignment card\"><div><small>WHO WILL SERVE?</small><h2>${c.name}様を誰が担当しますか？</h2><p>${state.customerConditions[c.id]?.icon||'♡'} ${state.customerConditions[c.id]?.line||'今日もよろしくお願いします。'}</p>${required?'<span class=\"important-customer\">✦ このストーリーはオーナー対応</span>':''}</div><div class=\"v6-assign-actions\"><button class=\"primary\" data-action=\"manualService\">自分で接客する<small>信頼・ストーリー・満足度上限UP</small></button>${roster.map(member=>{const fit=staffCustomerAffinity(member,c),off=isStaffOffToday(member),tired=Number(member.energy)<10,unavailable=off||tired,prefix=fit.favorite?'★ 指名 · ':fit.score>=5?'◎ おすすめ · ':'';return`<button class=\"soft\" data-assign-staff=\"${member.id}\" ${required||unavailable?'disabled':''}>${member.name}に任せる<small>${off?'本日休み · ':tired?'要休養 · ':''}${prefix}相性${fit.label} ${fit.score>0?`+${fit.score}`:fit.score||''} · Energy ${member.energy}% · 連勤${member.consecutiveWorkDays||0}日</small></button>`}).join('')}</div>${!roster.length?'<p class=\"important-customer\">担当できるスタッフがいません</p>':''}<button class=\"soft wide\" data-action=\"pauseTown\">顧客の合間に街へ出る</button></div>`}\nfunction treatmentDecisionPageV6"""
          text2,n = re.subn(pattern,new_assignment,text,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'assignment replacement failed: {n}')
          text = text2

          old = "  const score=clamp(Math.min(plan.cap||100,Math.round(s.base+state.staff.service*.22+state.staff.tech*.22+match+equipmentBonus(c)+fashion+machine+trend+skillBonus+affinity+specialty+customerFit.score+choice.satisfaction+conditionBonus+dayModifier+planModifier+autoModifier-pricePenalty-energyPenalty)),0,100);"
          new = "  const fatiguePenalty=staffFatiguePenalty(state.staff),score=clamp(Math.min(plan.cap||100,Math.round(s.base+state.staff.service*.22+state.staff.tech*.22+match+equipmentBonus(c)+fashion+machine+trend+skillBonus+affinity+specialty+customerFit.score+choice.satisfaction+conditionBonus+dayModifier+planModifier+autoModifier-pricePenalty-energyPenalty-fatiguePenalty)),0,100);"
          if old not in text: raise SystemExit('score anchor not found')
          text = text.replace(old,new,1)

          old = "  const energyCost=treatmentEnergyCost(state.staff,policy.effects.energy||1,10+Math.floor(Math.random()*11));state.staff.energy=clamp(state.staff.energy-energyCost,0,100);state.staff.xp+=10;state.staff.treatments++;state.staff.monthlySales+=sale;if(score>=90){state.staff.bond=clamp(state.staff.bond+1,0,100);state.staff.monthlyPerfect++}let staffLevelUp=false;"
          new = "  markStaffWorked(state.staff);const energyCost=treatmentEnergyCost(state.staff,policy.effects.energy||1,10+Math.floor(Math.random()*11));state.staff.energy=clamp(state.staff.energy-energyCost,0,100);state.staff.xp+=10;state.staff.treatments++;state.staff.monthlySales+=sale;if(score>=90){state.staff.bond=clamp(state.staff.bond+1,0,100);state.staff.monthlyPerfect++}let staffLevelUp=false;"
          if old not in text: raise SystemExit('energy spend anchor not found')
          text = text.replace(old,new,1)

          old = "function advanceDay(rest=false){state.day++;state.weekday=weekdays[(state.day-1)%7];state.todaySales=0;state.session=null;state.activeBusinessSession=null;state.pausedBusinessState=null;if((state.day-1)%30===0){const month=Math.floor((state.day-1)/30)+1;state.monthlyStats={sales:0,reviews:0,perfect:0,newCustomers:0};state.monthlyGoals=createMonthlyGoals(month);state.news.unshift(`MONTHLY GOAL ${month}が始まりました`)}state.dailyTrend=copy(trends[(state.day-1)%trends.length]);state.dailyMissions=createDailyMissions(state.day);state.dailyMissionRewarded=false;state.reservations=createReservations();state.ownerEnergy=clamp(state.ownerEnergy+(rest?45:10),0,100);if(rest&&state.staff)state.staff.energy=100;state.dailyPolicy=null;state.dailyWeather=createDailyWeather(state.day);state.customerConditions={};state.todayHighlights=[];state.dailyPrepared=false;checkCustomerUnlocks();state.screen='home';save();render()}"
          new = "function advanceDay(rest=false){state.day++;state.weekday=weekdays[(state.day-1)%7];state.todaySales=0;state.session=null;state.activeBusinessSession=null;state.pausedBusinessState=null;if((state.day-1)%30===0){const month=Math.floor((state.day-1)/30)+1;state.monthlyStats={sales:0,reviews:0,perfect:0,newCustomers:0};state.monthlyGoals=createMonthlyGoals(month);state.news.unshift(`MONTHLY GOAL ${month}が始まりました`)}state.dailyTrend=copy(trends[(state.day-1)%trends.length]);state.dailyMissions=createDailyMissions(state.day);state.dailyMissionRewarded=false;state.reservations=createReservations();state.ownerEnergy=clamp(state.ownerEnergy+(rest?45:10),0,100);recoverStaffForNewDay(state,rest);state.dailyPolicy=null;state.dailyWeather=createDailyWeather(state.day);state.customerConditions={};state.todayHighlights=[];state.dailyPrepared=false;checkCustomerUnlocks();state.screen='home';save();render()}"
          if old not in text: raise SystemExit('advanceDay anchor not found')
          text = text.replace(old,new,1)

          pattern = r"function staffPageV62\(\)\{.*?\}\n\nfunction render\(\)"
          replacement = """function staffPageV62(){const base=staffPageV5();if(!state.staff)return base;const candidates=extraStaff.filter(x=>!state.staffRoster.some(s=>s.id===x.id)),days=['月','火','水','木','金','土','日'];return`${base}<section class=\"card\"><h2>STAFF ROSTER</h2>${state.staffRoster.map(x=>`<button class=\"soft\" data-active-staff=\"${x.id}\">${x.name}${x.id===state.staff.id?' · 担当中':''}</button>`).join(' ')}${candidates.length?`<h3>新しい人材</h3><div class=\"grid\">${candidates.map(x=>`<div class=\"card\"><h3>${x.name}</h3><span class=\"pill\">${x.trait}</span><p>${x.profile.personality}</p><button class=\"primary wide\" data-hire-extra=\"${x.id}\">採用 ${yen(x.salary)}</button></div>`).join('')}</div>`:''}</section><section class=\"card\"><h2>週間シフト・休養</h2><p>週2日まで公休を設定できます。休みの日は担当できず、Energyが大きく回復します。</p>${state.staffRoster.map(member=>`<div class=\"card\"><div class=\"row\"><span><b>${member.name}</b></span><b>Energy ${member.energy}% · 連勤 ${member.consecutiveWorkDays||0}日</b></div><div>${days.map((day,i)=>`<button class=\"${member.weeklyOff?.includes(i)?'primary':'soft'}\" data-staff-off=\"${member.id}\" data-weekday=\"${i}\">${day}${member.weeklyOff?.includes(i)?'休':''}</button>`).join(' ')}</div><small>${isStaffOffToday(member)?'今日は公休です':Number(member.energy)<10?'Energy不足で担当不可':'本日勤務可能'}</small></div>`).join('')}</section>`}\n\nfunction render()"""
          text2,n = re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'staff page replacement failed: {n}')
          text = text2

          old = "  document.querySelectorAll('[data-active-staff]').forEach(b=>b.onclick=()=>{const x=state.staffRoster.find(s=>s.id===b.dataset.activeStaff);if(x){state.staff=x;save();render()}});"
          new = old + "\n  document.querySelectorAll('[data-staff-off]').forEach(b=>b.onclick=()=>{if(!toggleStaffDayOff(b.dataset.staffOff,+b.dataset.weekday))return notify('公休は週2日まで設定できます');save();render()});"
          if old not in text: raise SystemExit('bind active staff anchor not found')
          text = text.replace(old,new,1)

          old = "window.__SALON_STORY_TEST__={freshState,migrate,normalizeStaffMember,normalizeStaffRoster,monthlyStaffPayroll,monthlyOperatingExpenses,staffSpecialtyAdjustment,treatmentEnergyCost,staffCustomerAffinity,updateStaffCustomerRelation,employedStaffRoster,assignedStaffForCurrentCustomer,assignStaffForCurrentCustomer,isNewCustomer"
          new = "window.__SALON_STORY_TEST__={freshState,migrate,normalizeStaffMember,normalizeStaffRoster,monthlyStaffPayroll,monthlyOperatingExpenses,staffSpecialtyAdjustment,treatmentEnergyCost,staffDayIndex,isStaffOffToday,staffAvailableToday,toggleStaffDayOff,markStaffWorked,staffFatiguePenalty,recoverStaffForNewDay,staffCustomerAffinity,updateStaffCustomerRelation,employedStaffRoster,assignedStaffForCurrentCustomer,assignStaffForCurrentCustomer,isNewCustomer"
          if old not in text: raise SystemExit('test export anchor not found')
          text = text.replace(old,new,1)

          game.write_text(text)

          test = Path('tests/v06-systems.test.mjs')
          t = test.read_text()
          anchor = "assert.equal(api.assignedStaffForCurrentCustomer().id,staffTemplates[1].id,'現在顧客の担当スタッフを取得できる');\n"
          extra = """\nconst scheduleState=api.migrate({...api.freshState(),day:1,staff:{...staffTemplates[0],energy:55},staffRoster:[{...staffTemplates[0],energy:55},{...staffTemplates[1],energy:40}]});\napi.setState(scheduleState);\nassert.equal(api.toggleStaffDayOff(staffTemplates[0].id,0),true,'公休を設定できる');\nassert.equal(api.isStaffOffToday(scheduleState.staffRoster[0],1),true,'設定曜日は公休になる');\nassert.equal(api.staffAvailableToday(scheduleState.staffRoster[0],1),false,'公休スタッフは担当不可');\nassert.equal(api.toggleStaffDayOff(staffTemplates[0].id,1),true);\nassert.equal(api.toggleStaffDayOff(staffTemplates[0].id,2),false,'公休は週2日まで');\napi.markStaffWorked(scheduleState.staffRoster[1],1);api.markStaffWorked(scheduleState.staffRoster[1],1);\nassert.equal(scheduleState.staffRoster[1].consecutiveWorkDays,1,'同一日は連勤日数を重複加算しない');\nscheduleState.staffRoster[1].lastWorkedDay=4;scheduleState.staffRoster[1].consecutiveWorkDays=5;api.markStaffWorked(scheduleState.staffRoster[1],5);\nassert.equal(scheduleState.staffRoster[1].consecutiveWorkDays,6,'連続勤務を記録');\nassert.equal(api.staffFatiguePenalty(scheduleState.staffRoster[1]),4,'5日超の連勤に疲労補正');\nscheduleState.day=8;scheduleState.staffRoster[0].energy=30;scheduleState.staffRoster[0].weeklyOff=[0];api.recoverStaffForNewDay(scheduleState,false);\nassert.equal(scheduleState.staffRoster[0].energy,75,'公休日はEnergyを大きく回復');\nassert.equal(scheduleState.staffRoster[0].consecutiveWorkDays,0,'公休日に連勤をリセット');\n"""
          if extra.strip() not in t:
              if anchor not in t: raise SystemExit('test insertion anchor not found')
              t = t.replace(anchor,anchor+extra,1)
          if "assert.match(source,/週間シフト・休養/,'スタッフシフトUI');" not in t:
              t = t.replace("assert.match(source,/data-assign-staff/,'顧客ごとのスタッフ担当選択UI');", "assert.match(source,/data-assign-staff/,'顧客ごとのスタッフ担当選択UI');\nassert.match(source,/週間シフト・休養/,'スタッフシフトUI');\nassert.match(source,/data-staff-off/,'公休設定UI');")
          test.write_text(t)
          PY
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/v62-systems.test.mjs
          node tests/state.test.mjs
          node tests/customer-encounters.test.mjs
      - name: Commit clean result
        run: |
          rm -f .github/workflows/apply-staff-phase4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add staff schedules and persistent fatigue [staff-phase4-applied]"
          git push origin HEAD:staff-phase4-schedule-fatigue
