name: apply-treatment-minigames
on:
  push:
    paths:
      - '.github/workflows/apply-treatment-minigames.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply treatment minigames
        run: python .github/scripts/apply_treatment_minigames.py
      - name: Run focused tests
        run: |
          node tests/v06-systems.test.mjs
          node tests/state.test.mjs
          node tests/v61-systems.test.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-v03.js src/v62.css tests/v06-systems.test.mjs
          git commit -m "feat: add treatment-specific minigames [treatment-minigames-applied]"
          git push origin main
