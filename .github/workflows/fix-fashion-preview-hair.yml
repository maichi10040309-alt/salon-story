name: Fix fashion preview owner hair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply preview hair fix
        run: |
          python - <<'PY'
          from pathlib import Path

          # Use the elegant updo (HAIR_15) as the owner's initial/try-on hairstyle.
          p=Path('src/owner-avatar.js')
          s=p.read_text()
          s=s.replace("hairStyle:'HAIR_05'", "hairStyle:'HAIR_15'")
          s=s.replace("hairStyles:['HAIR_05']", "hairStyles:['HAIR_15']")
          s=s.replace("?v=81", "?v=83")
          p.write_text(s)

          p=Path('src/game-v03.js')
          s=p.read_text()
          s=s.replace("hairStyle:'HAIR_05'", "hairStyle:'HAIR_15'")
          s=s.replace("hairOwned:['HAIR_05']", "hairOwned:['HAIR_15']")
          s=s.replace("from'./v61-systems.js';", "from'./v61-systems.js?v=83';")
          p.write_text(s)

          p=Path('src/v61-systems.js')
          s=p.read_text()
          old="export function previewFashionAppearance(current,item){const next={...normalizeOwnerAssetAppearance(current)};const key={dresses:'dress',bags:'bag'}[item.category]||item.category;next[key]=ownerAssetForItem(item);if(item.category==='dresses'){next.tops=null;next.bottoms=null}else if(['tops','bottoms'].includes(item.category))next.dress=null;return next}"
          new="export function previewFashionAppearance(current,item){const next={...normalizeOwnerAssetAppearance(current)};const key={dresses:'dress',bags:'bag'}[item.category]||item.category;next[key]=ownerAssetForItem(item);if(item.category==='dresses'){next.tops=null;next.bottoms=null}else if(['tops','bottoms'].includes(item.category))next.dress=null;next.hairStyle='HAIR_15';return next}"
          if old not in s:
              raise SystemExit('previewFashionAppearance pattern not found')
          p.write_text(s.replace(old,new))

          p=Path('index.html')
          s=p.read_text().replace('v=82','v=83').replace('v82 -','v83 -')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/owner-avatar.js src/game-v03.js src/v61-systems.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: match fashion preview hair to initial owner"
            git push
          fi
